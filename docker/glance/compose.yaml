services:
  glance:
    container_name: glance
    image: docker.io/glanceapp/glance:v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
    ports:
      - 127.0.0.1:8080:8080
    env_file:
      - secrets.enc.env
