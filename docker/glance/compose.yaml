services:
  glance:
    container_name: glance
    image: docker.io/glanceapp/glance:v0.8.7@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
    ports:
      - 127.0.0.1:8080:8080
    env_file:
      - secrets.enc.env
