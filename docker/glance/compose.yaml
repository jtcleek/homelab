services:
  glance:
    container_name: glance
    image: docker.io/glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
    ports:
      - 127.0.0.1:8080:8080
    env_file:
      - secrets.enc.env
