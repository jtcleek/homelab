services:
  dozzle:
    container_name: dozzle
    image: docker.io/amir20/dozzle:v11.4.2@sha256:08cd5230e21e364241f3dcf26191f293166f7835654eb7e41168b9c685f0947b
    volumes:
      - ./certs:/certs
      - data:/data
      - /run/user/1000/docker.sock:/var/run/docker.sock:ro
    ports:
      - 127.0.0.1:8888:8080
    env_file:
      - secrets.enc.env
volumes:
  data:
