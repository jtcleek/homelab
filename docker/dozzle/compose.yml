services:
  dozzle:
    container_name: dozzle
    image: docker.io/amir20/dozzle:v11.3.5@sha256:dd09e6aaa9d5ad686b6017427a502c40dc862ba28445609813e5ea1f66f6dbdf
    volumes:
      - ./certs:/certs
      - data:/data
      - /run/user/1000/docker.sock:/var/run/docker.sock:ro
    ports:
      - 127.0.0.1:8888:8080
    env_file:
      - secrets.enc.env
volumes:
  data:
