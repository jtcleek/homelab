services:
  dozzle:
    container_name: dozzle
    image: docker.io/amir20/dozzle:v11.5.0@sha256:74600d62dd73a72a5d36fbd0c98af649203df921d74310b7ed383ef63392358e
    volumes:
      - ./certs:/certs
      - data:/data
      - /run/user/1000/docker.sock:/var/run/docker.sock:ro
    ports:
      - 127.0.0.1:8888:8080
    env_file:
      - secrets.enc.env
volumes:
  data:
