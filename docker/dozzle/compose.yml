services:
  dozzle:
    container_name: dozzle
    image: docker.io/amir20/dozzle:v11.2.0@sha256:db7e19fd36189823c66239894e821561cb201248af35362ec6d39a08e23ff88b
    volumes:
      - ./certs:/certs
      - dozzle_data:/data
      - /run/user/1000/docker.sock:/var/run/docker.sock:ro
    ports:
      - 127.0.0.1:8888:8080
    env_file:
      - secrets.enc.env
volumes:
  dozzle_data:
