services:
  headscale:
    image: docker.io/headscale/headscale:v0.29.4@sha256:8833f828b414c0907b7e5c71da76473216fe17cce0818a166b536ec552c0903f
    container_name: headscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/headscale
    ports:
      - '127.0.0.1:8080:8080' #IPv4
      - '[::1]:8080:8080' #IPv6
      - '127.0.0.1:9090:9090'
    volumes:
      - '/opt/headscale/conf:/etc/headscale:ro'
      - '/opt/headscale/lib:/var/lib/headscale'
    command: serve
    healthcheck:
        test: ["CMD", "headscale", "health"]
