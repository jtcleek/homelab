services:
  headscale:
    image: docker.io/headscale/headscale:v0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
    container_name: headscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/headscale
    ports:
      - '127.0.0.1:8080:8080' #IPv4
      - '[::1]:8080:8080' #IPv6
      - '127.0.0.1:9090:9090'
    volumes:
      - '/opt/headscale/conf:/etc/headscale:ro'
      - '/opt/headscale/lib:/var/lib/headscale'
    command: serve
    healthcheck:
        test: ["CMD", "headscale", "health"]
