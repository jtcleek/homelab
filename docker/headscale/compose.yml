services:
  headscale:
    image: docker.io/headscale/headscale:v0.29.3@sha256:0e7f1c6e4ce6c2a2a001103ecd3fa645a045adf30ac8a5234fe037b43000cd72
    container_name: headscale
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:9090:9090'
    volumes:
      - '/opt/headscale/conf:/etc/headscale'
      - '/opt/headscale/lib:/var/lib/headscale'
      - '/opt/headscale/run:/var/run/headscale'
    command: serve
