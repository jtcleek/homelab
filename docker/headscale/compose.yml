services:
  headscale:
    image: docker.io/headscale/headscale:v0.29.6@sha256:cabe84f0699913dbca9320f0883dca7565dd08df3c5be29edfabbebeff763966
    container_name: headscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/headscale
    ports:
      - '127.0.0.1:8080:8080' #IPv4
      - '[::1]:8080:8080' #IPv6
      - '127.0.0.1:9090:9090'
    volumes:
      - '/opt/headscale/conf:/etc/headscale:ro'
      - '/opt/headscale/lib:/var/lib/headscale'
    command: serve
    healthcheck:
        test: ["CMD", "headscale", "health"]
