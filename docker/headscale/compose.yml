services:
  headscale:
    image: docker.io/headscale/headscale:v0.29.5@sha256:780ed2f9e85719a2211277433f2c8afb45105d0d25031949a6848a485f9e216d
    container_name: headscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/headscale
    ports:
      - '127.0.0.1:8080:8080' #IPv4
      - '[::1]:8080:8080' #IPv6
      - '127.0.0.1:9090:9090'
    volumes:
      - '/opt/headscale/conf:/etc/headscale:ro'
      - '/opt/headscale/lib:/var/lib/headscale'
    command: serve
    healthcheck:
        test: ["CMD", "headscale", "health"]
