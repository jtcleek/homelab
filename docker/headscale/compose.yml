services:
  headscale:
    image: docker.io/headscale/headscale:v0.29.8@sha256:f549a444481d7ab0ad8b506a7ee43cadb00001a20fbaec34b56f8ccb136735e0
    container_name: headscale
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/headscale
    ports:
      - '127.0.0.1:8080:8080' #IPv4
      - '[::1]:8080:8080' #IPv6
      - '127.0.0.1:9090:9090'
    volumes:
      - '/opt/headscale/conf:/etc/headscale:ro'
      - '/opt/headscale/lib:/var/lib/headscale'
    command: serve
    healthcheck:
        test: ["CMD", "headscale", "health"]
