services:
  babybuddy:
    image: lscr.io/linuxserver/babybuddy:2.11.0@sha256:69235a527e02788aeb367b2bd9bac33365690cf18e2183330999225bb0a7f97b
    container_name: babybuddy
    ports:
      - "127.0.0.1:8000:8000"
