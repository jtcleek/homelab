services:
  babybuddy:
    image: lscr.io/linuxserver/babybuddy:2.11.0@sha256:b19394db47554ab385e5513dcb4aed253f551a19ac89576a9df191ed59b683de
    container_name: babybuddy
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - secrets.enc.env
    volumes:
      - data:/config
    restart: unless-stopped
volumes:
  data:
    driver: local
